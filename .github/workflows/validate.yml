name: Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore:
      - main

permissions: {}

jobs:
  # Windows runners cannot run Linux containers, so that leg covers only
  # the CLI, config and template layers — but on a real Windows filesystem
  # and console, which is what catches path and TTY bugs cross-compiling
  # cannot. Lint there is also what checks exec_windows.go. -race needs
  # cgo and a C toolchain, so only the Linux leg runs the detector.
  #
  # Each step runs twice: once for the default build and once with the
  # secrets_1password tag. Without the tagged runs, the 1Password provider
  # (internal/secrets/onepassword.go) is never compiled, tested or linted.
  # The tagged tests make no live SDK call.
  go-validation:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Go
            os: ubuntu-24.04
            test-flags: -race
          - name: Go (windows)
            os: windows-latest
            test-flags: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        shell: bash
        env:
          TEST_FLAGS: ${{ matrix.test-flags }}
        run: go test $TEST_FLAGS ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

      - name: Run go vet (1password)
        run: go vet -tags=secrets_1password ./...

      - name: Run tests (1password)
        shell: bash
        env:
          TEST_FLAGS: ${{ matrix.test-flags }}
        run: go test $TEST_FLAGS -tags=secrets_1password ./...

      - name: Run golangci-lint (1password)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --build-tags=secrets_1password

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./...

  # Builds the ccodolo-1password release build for all six targets with the
  # real goreleaser config, so a break in the zig cross-compile shows up on
  # the PR and not on release day. The matrix above stays cgo-free.
  build-1password:
    name: Build (1password)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      # Keep the version and the pin in step with release.yml.
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
          use-cache: false

      - name: Build snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.15.2"
          args: build --snapshot --clean --id ccodolo-1password
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/zig-cache

  docker-build:
    name: Build image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build ccodolo binary
        run: go build -o ccodolo .

      - name: Build image and run toolchain smoke test
        run: |
          IMAGE=$(./ccodolo --project ci-smoke --create-new --agent claude --tools nodejs,golang,python --build-only --rebuild | tail -n1)
          echo "Built image: $IMAGE"
          timeout 60 docker run --rm --entrypoint sh "$IMAGE" -c 'node --version && go version && python3 --version && claude --version'

      - name: Session wrapper smoke test
        run: |
          IMAGE=$(./ccodolo --project ci-smoke --agent claude --build-only | tail -n1)
          # The tmux config loads cleanly and its terminal type exists.
          timeout 60 docker run --rm --entrypoint sh "$IMAGE" -c \
            'tmux -L smoke -f /dev/null new-session -d sleep 5 && tmux -L smoke source-file /etc/ccodolo/tmux.conf && infocmp tmux-256color >/dev/null'
          # With a TTY the command runs inside the "agent" tmux session and
          # its exit status becomes the container's.
          status=0
          timeout 60 docker run --rm -t --entrypoint sh "$IMAGE" /etc/ccodolo/session.sh sh -c 'tmux has-session -t agent && exit 3' || status=$?
          [ "$status" -eq 3 ] || { echo "expected exit 3 from the agent session, got $status"; exit 1; }
          # docker stop is prompt: session.sh, as PID 1, handles SIGTERM.
          CID=$(docker run -d -t --entrypoint sh "$IMAGE" /etc/ccodolo/session.sh sleep 300)
          sleep 2
          start=$(date +%s)
          docker stop "$CID" >/dev/null
          elapsed=$(( $(date +%s) - start ))
          docker rm "$CID" >/dev/null
          [ "$elapsed" -lt 5 ] || { echo "docker stop took ${elapsed}s: session.sh did not handle SIGTERM"; exit 1; }
