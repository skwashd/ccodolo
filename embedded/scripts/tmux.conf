# ccodolo tmux config. The agent runs inside tmux so it can be detached from
# and reattached to (ccodolo --dashboard). The goal is for tmux to be
# invisible: no status bar, no prefix key, and the outer terminal's
# capabilities passed through. Ctrl+] is the only binding.

set -g prefix None
set -g prefix2 None
unbind-key -a -T prefix
bind-key -n C-] detach-client

set -g status off
set -s escape-time 0
set -g default-shell /bin/zsh

# Terminal fidelity: 256 colours plus truecolor, extended keys (Shift+Enter
# and friends) in the CSI u encoding agents expect, OSC 52 clipboard writes,
# and passthrough for desktop notifications.
set -g default-terminal tmux-256color
set -as terminal-features ',*:RGB'
set -s extended-keys always
set -s extended-keys-format csi-u
set -s set-clipboard on
set -g allow-passthrough on
set -s focus-events on

# The host terminal's native scrollback cannot see inside tmux, so keep a
# deep history and let the mouse wheel scroll it (copy mode). The dashboard's
# review view reads the same history.
set -g history-limit 50000
set -g mouse on

# The launch terminal stays attached (with nothing reading it) after a
# detach; size the window to whichever client was used last.
set -g window-size latest
