version: 2

# Completion scripts are platform-independent, so generate them once with the
# host toolchain. File names are what each shell's loader looks for: bash
# matches the command name, zsh wants _<command>, fish wants <command>.fish.
before:
  hooks:
    - rm -rf completions
    - mkdir completions
    - sh -c 'go run . completion bash > completions/ccodolo'
    - sh -c 'go run . completion zsh > completions/_ccodolo'
    - sh -c 'go run . completion fish > completions/ccodolo.fish'

builds:
  - id: ccodolo
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

# GoReleaser's default is tar.gz for every platform, Windows included.
archives:
  - formats: [tar.gz]
    # Setting files replaces GoReleaser's default list, so keep LICENSE and
    # README alongside the completions.
    files:
      - LICENSE
      - README.md
      - completions/*
    format_overrides:
      - goos: windows
        formats: [zip]

universal_binaries:
  - id: ccodolo-universal
    ids:
      - ccodolo
    name_template: "{{ .ProjectName }}"
    replace: true

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - ccodolo-universal
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

checksum:
  name_template: "checksums.txt"

changelog:
  filters:
    exclude:
      - "^docs:"
      - "^ci:"
      - "^test:"

homebrew_casks:
  - name: ccodolo
    binaries:
      - ccodolo
    completions:
      bash: completions/ccodolo
      zsh: completions/_ccodolo
      fish: completions/ccodolo.fish
    repository:
      owner: skwashd
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/skwashd/ccodolo"
    description: "Sandboxed Docker containers for running AI coding assistants in YOLO mode"
    license: "MIT"
    commit_author:
      name: goreleaserbot
      email: skwashd@gmail.com
